    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            min-height: 100vh;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            background: url('https://images.unsplash.com/photo-1439792675105-701e6a4ab6f0?q=80&w=1173&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        .bg-circles {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .bg-circles span {
            position: absolute;
            border-radius: 50%;
            opacity: 0.25;
            filter: blur(2px);
        }
        .circle1 { width: 120px; height: 120px; background: #ff6e7f; left: 10vw; top: 20vh; }
        .circle2 { width: 80px; height: 80px; background: #00ffe7; left: 70vw; top: 30vh; }
        .circle3 { width: 60px; height: 60px; background: #fff; left: 50vw; top: 70vh; }
        .circle4 { width: 40px; height: 40px; background: #ffb86c; left: 80vw; top: 80vh; }
        .circle5 { width: 100px; height: 100px; background: #8be9fd; left: 30vw; top: 60vh; }
        .center-content {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1;
            box-sizing: border-box;
            padding: 32px;
        }
        .icon-links {
            display: flex;
            gap: 40px;
            margin-top: 0;
            justify-content: center; /* garanti ortalama */
        }
        .icon-btn {
            width: 70px;
            height: 70px;
            background: rgba(20,20,40,0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2em;
            color: #fff;
            border: 2px solid #fff;
            transition: background 0.2s, color 0.2s, border 0.2s;
            text-decoration: none;
        }
        .icon-btn:hover {
            background: #ff6e7f;
            color: #fff;
            border: 2px solid #ff6e7f;
        }
        .cv-btn {
            margin-bottom: 48px;
            padding: 18px 48px;
            background: #ff6e7f;
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12);
            transition: background 0.2s;
        }
        .cv-btn:hover {
            background: #00ffe7;
            color: #2d1e4f;
        }
        @media (max-width: 900px) {
            .center-content {
                flex-direction: column;
                padding: 24px;
                min-height: 100vh;
                width: 100vw;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
            }
            h1 {
                font-size: 2.2em !important;
            }
            .cv-btn {
                padding: 14px 32px;
                font-size: 1.05em;
                margin-bottom: 32px;
            }
            .icon-links {
                gap: 24px !important;
                flex-wrap: wrap;
            }
            .icon-btn {
                width: 56px;
                height: 56px;
                font-size: 1.5em;
            }
            .icon-links > div {
                margin-bottom: 10px;
            }
            .icon-links svg {
                width: 24px;
                height: 24px;
            }
            .icon-links span {
                font-size: 1em;
            }
        }
        @media (max-width: 500px) {
            h1 {
                font-size: 1.1em !important;
            }
            .cv-btn {
                padding: 10px 16px;
                font-size: 0.95em;
            }
            .icon-links {
                gap: 12px !important;
            }
            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 1em;
            }
            .icon-links svg {
                width: 16px;
                height: 16px;
            }
            .icon-links span {
                font-size: 0.85em;
            }
        }
    </style>
</head>
